# CI — lance les tests unitaires (Vitest) et e2e (Playwright)
# sur chaque PR et chaque push vers main.
#
# Secrets GitHub Actions requis (Settings → Secrets and variables → Actions) :
# - STAGING_SUPABASE_URL
# - STAGING_SUPABASE_ANON_KEY
# - SUPABASE_ACCESS_TOKEN          (CLI Supabase — link/db push)
# - STAGING_SUPABASE_DB_PASSWORD   (db push staging, job test)
# - SUPABASE_DB_PASSWORD           (db push prod, job migrate-prod — coffre Actions uniquement)
#
# Les e2e tapent l'instance Supabase STAGING, jamais la prod.
# ⚠ Les secrets utilisés sur les PR (tous sauf SUPABASE_DB_PASSWORD) doivent
# exister dans DEUX coffres : Actions ET Dependabot (les workflows déclenchés
# par les PR Dependabot lisent le coffre Dependabot).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Déclenchement manuel : filet de sécurité quand GitHub « zappe » le run push
  # d'un merge (vécu sur le merge de #56 PR2 : aucun run push créé → migrate-prod
  # jamais exécuté, prod restée en arrière du staging). Permet de relancer la CI
  # (et donc migrate-prod, cf. son `if` ci-dessous) sur main à la demande.
  workflow_dispatch:

jobs:
  # Lint + tests unitaires — indépendant de Supabase/Playwright, tourne EN
  # PARALLÈLE des e2e (plus sur le chemin critique de l'e2e).
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      # Ni `next build` (Next 16) ni les tests ne lancent ESLint :
      # sans cette étape, une dépendance qui casse le lint passe en CI
      # (vécu avec le bump eslint 10, incompatible eslint-config-next).
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tests unitaires (Vitest)
        # `vitest` détecte CI=true et tourne en mode single-run, pas en watch.
        run: npm run test

  # Applique les migrations sur le STAGING UNE SEULE FOIS avant les e2e (les deux
  # partitions e2e en dépendent). `db push` est idempotent ; le faire dans un job
  # à part évite deux `db push` concurrents (course sur l'historique de migration).
  migrate-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Appliquer les migrations (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase link --project-ref upxoxrjumxpzumakawiv
          npx supabase db push

  # Pré-chauffe le cache du navigateur Playwright UNE SEULE FOIS, en parallèle de
  # migrate-staging (hors chemin critique : e2e attend déjà migrate-staging, donc
  # le portail ne grandit pas). Sans ce job, les 6 jobs e2e partageaient la même
  # clé de cache et se couraient dessus À LA SAUVEGARDE (6 restore simultanés sur
  # une clé absente → 6 miss → 6 téléchargements, un seul `save` gagne) : le job le
  # plus long re-téléchargeait chromium à CHAQUE run (~9-11 min, cf. piège « Cache
  # navigateur Playwright »). Ici UN SEUL job peuple le cache ; les e2e ne font plus
  # que le RESTAURER (restore-only, jamais save → plus aucune course).
  playwright-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      # Clé de cache sur la VERSION de Playwright (dérivée du module installé), pas
      # le hash de package-lock entier : un bump de dépendance sans rapport
      # n'invalide plus le navigateur. Dérivée → pas de twin à maintenir à la main.
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache du navigateur Playwright
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Binaire seul (pas --with-deps) : les deps système (apt) ne sont pas
      # cachables et sont (ré)installées par chaque job e2e via install-deps.
      # Borné à 5 min → un stall CDN échoue vite (rejeu CI) au lieu de tenir 10 min.
      - name: Télécharger chromium (si cache absent)
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

  # E2E en jobs parallèles (cf. projets playwright + Phase 2) :
  #  - jetable : specs à comptes jetables uniques → un job, workers:4 ;
  #  - partage : specs du compte partagé → réparties en 5 GROUPES de fichiers
  #    équilibrés (~10-15 tests), CHACUN sur SON PROPRE compte (E2E_EMAIL distinct
  #    p1..p5, auto-créé par auth.setup idempotent). Isolation par compte → les
  #    groupes ne se courent pas dessus (workers:1 intra-groupe, parallélisme
  #    INTER-groupes). Aucun changement de specs/helpers : helpers.ts et
  #    auth.setup.ts lisent déjà process.env.E2E_EMAIL.
  # NB : groupes EXPLICITES plutôt que `--shard` (Playwright shard par fichier →
  # déséquilibre, planning.spec à lui seul pèse lourd → scindé en planning.spec +
  # planning-edition.spec). À rééquilibrer si on ajoute des specs. Chaque job
  # build l'app en prod (webServer) et tourne concurremment.
  e2e:
    # playwright-cache peuple le cache du navigateur AVANT ces jobs → ils le
    # restaurent (rapide) au lieu de le télécharger chacun (cf. ce job).
    needs: [migrate-staging, playwright-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jetable
            project: e2e-jetable
            workers: 4
            files: ""
            email: claude-e2e-test@example.com
          - name: partage-1
            project: e2e-partage
            workers: 1
            files: "e2e/planning.spec.ts"
            email: claude-e2e-p1@example.com
          - name: partage-2
            project: e2e-partage
            workers: 1
            files: "e2e/planning-edition.spec.ts"
            email: claude-e2e-p2@example.com
          - name: partage-3
            project: e2e-partage
            workers: 1
            files: "e2e/courses.spec.ts e2e/accueil.spec.ts"
            email: claude-e2e-p3@example.com
          - name: partage-4
            project: e2e-partage
            workers: 1
            files: "e2e/recettes.spec.ts e2e/reglages.spec.ts"
            email: claude-e2e-p4@example.com
          - name: partage-5
            project: e2e-partage
            workers: 1
            files: "e2e/profil.spec.ts e2e/foyer.spec.ts e2e/auth.spec.ts e2e/coches-realtime.spec.ts e2e/alerte-planning.spec.ts"
            email: claude-e2e-p5@example.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci

      # auth.setup.ts et le build Next lisent .env.local (pas process.env) :
      # on le génère depuis les secrets. Les NEXT_PUBLIC_* sont inlinés AU BUILD
      # → ce fichier doit exister avant `next build` (lancé par le webServer).
      - name: Générer .env.local depuis les secrets (staging)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          } > .env.local

      # Même version dérivée que playwright-cache → même clé de cache.
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # RESTORE seulement (jamais de save) : playwright-cache est SEUL autoritaire
      # pour peupler le cache → aucune course à la sauvegarde entre les 6 jobs.
      - name: Restaurer le navigateur Playwright
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # PAS de `playwright install-deps` (apt) : les runners ubuntu-latest
      # préinstallent Chrome/Chromium → les libs système dont le chromium de
      # Playwright a besoin (libnss3, libasound2, libgbm, libxkbcommon…) sont
      # déjà là. install-deps lance `apt-get update` qui tape les miroirs Ubuntu
      # d'Azure : non cachable, sujet aux stalls de miroir, vu monter à 10-15 min
      # (cf. piège « Cache navigateur Playwright »). On le supprime — si un jour
      # une lib manque, chromium échoue au lancement de façon bruyante en e2e.

      # Filet : si le restore a manqué (clé évincée, éventuelle consistance), on
      # retélécharge le binaire — borné à 5 min pour échouer vite au lieu de tenir
      # les 15 min du job. En régime normal, playwright-cache a déjà peuplé la clé
      # exacte → cache-hit=true → cette étape est sautée.
      - name: Télécharger chromium (filet, si cache absent)
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Tests e2e (Playwright) — partition ${{ matrix.name }}
        # E2E_EMAIL dédié par groupe → isolation des données (auth.setup le crée
        # idempotemment ; E2E_PASSWORD reste le défaut du code). `files` vide
        # (jetable) lance toute la partition ; sinon, filtre sur les fichiers du
        # groupe (le projet `setup` tourne quand même — vérifié).
        env:
          E2E_EMAIL: ${{ matrix.email }}
        run: npx playwright test --project=${{ matrix.project }} --workers=${{ matrix.workers }} ${{ matrix.files }}

      # En cas d'échec e2e, le rapport HTML (traces incluses) est téléchargeable
      # depuis l'onglet Actions du run.
      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.name }}
          # test-results/ porte les traces .zip ET les captures d'échec
          # (screenshot: only-on-failure) — lisibles directement.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Applique les migrations sur la PROD — uniquement sur push vers main
  # (jamais sur les PR), et seulement si tout est vert (unit + les 2 partitions e2e).
  # Tourne toujours avec le coffre Actions (un push n'est jamais un
  # événement Dependabot), d'où SUPABASE_DB_PASSWORD dans ce seul coffre.
  migrate-prod:
    # push sur main (nominal) OU déclenchement manuel (rattrapage si le run push
    # d'un merge a été zappé par GitHub).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer les migrations (prod)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase link --project-ref gabyhlcwahzquolwxmgd
          npx supabase db push
