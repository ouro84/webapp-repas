# Configuration Dependabot — mises à jour automatiques des dépendances
# Doc : https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Dépendances npm (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Convention de commit du projet : `chore: ...`
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      # Une seule PR hebdomadaire pour les mises à jour patch + minor.
      # Les mises à jour majeures restent hors groupe → PRs séparées.
      dependances-non-majeures:
        update-types:
          - "minor"
          - "patch"
      # Majeures de Vitest groupées : @vitest/ui exige la même version exacte
      # de vitest en peer, donc deux PRs séparées cassent chacune `npm ci`
      # (ERESOLVE, cas #397/#398).
      vitest-majeure:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
    ignore:
      # ESLint 10 casse eslint-config-next 16.2.7 : son eslint-plugin-react
      # (7.x) utilise context.getFilename, supprimé en v10. Retirer cette
      # règle quand eslint-config-next supportera ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (portage natif Go) casse l'outillage : typescript-eslint
      # (utilisé par eslint-config-next) déclare le peer `typescript <6.1.0`
      # (PR #286 fermée, CI rouge). Les patchs 6.0.x passent toujours par le
      # groupe. Retirer cette règle quand typescript-eslint acceptera TS 7 :
      # le workflow `veille-typescript-7.yml` ouvre alors une issue, et il est
      # à supprimer dans la même PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      actions-non-majeures:
        update-types:
          - "minor"
          - "patch"
